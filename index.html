    <script>
      (function() {
        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          
          function defineFetchOn(obj) {
            try {
              Object.defineProperty(obj, 'fetch', {
                get: function() {
                  return customFetch || originalFetch;
                },
                set: function(fn) {
                  customFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
              return true;
            } catch (e) {
              return false;
            }
          }

          if (!defineFetchOn(window)) {
            defineFetchOn(Window.prototype);
          }
        } catch (err) {
          console.warn('Fetch setter safeguard init error:', err);
        }
      })();
    </script>
